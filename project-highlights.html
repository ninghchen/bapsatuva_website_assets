<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project Highlights — BAPS @ UVA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700;900&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>

:root{
  --blue:#1827E8;
  --blue-mid:#455adf;
  --blue-dark:#0f1a99;
  --sky:#5b70f0;
  --periwinkle:#bfc4f5;
  --lavender:#f0f1fc;
  --white:#ffffff;
  --gold:#e5c455;
  --gold-bright:#f7c82c;
  --gold-deep:#c9980a;
  --ink:#1c1c1c;
}
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}
html{
  scroll-behavior:smooth;
}
body{
  margin:0;
  background:transparent;
  font-family:'Montserrat',sans-serif;
  color:var(--ink);
  line-height:1.75;
  -webkit-font-smoothing:antialiased;
}
#baps-home{
  width:100%;
  background:transparent;
  overflow-x:hidden;
}
#baps-home a{
  color:inherit;
  text-decoration:none;
}
#baps-home .wrap{
  max-width:1200px;
  width:100%;
  margin:0 auto;
  padding:0 24px;
}
#baps-home h1,
#baps-home h2,
#baps-home h3{
  font-family:'Merriweather',serif;
  font-weight:900;
  color:var(--blue);
  line-height:1.15;
  margin:0;
}
/* =========================================================
   SITE HEADER (full-bleed photo hero — same as Our Team)
   ========================================================= */
#baps-home .team-hero{
  position:relative;
  min-height:clamp(320px,46vw,520px);
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  overflow:hidden;
  background-image:url('https://raw.githubusercontent.com/ninghchen/bapsatuva_website_assets/main/Photos/IMG_0005.jpg');
  background-size:cover;
  background-position:center;
}
#baps-home .team-hero::before{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(180deg, rgba(120,86,10,.3) 0%, rgba(120,86,10,.45) 60%, rgba(120,86,10,.62) 100%);
}
#baps-home .team-hero-inner{
  position:relative;
  z-index:1;
  max-width:760px;
  margin:0 auto;
  padding:0 24px;
}
#baps-home .team-hero h1{
  font-size:50px;
  font-weight:900;
  color:var(--white);
  line-height:1.05;
}
/* =========================================================
   TYPOGRAPHY (same scale as home / our team)
   ========================================================= */
#baps-home .t-h1{
  font-size:34px;
  font-weight:900;
}
#baps-home .t-h3{
  font-size:21px;
  font-weight:700;
  line-height:1.35;
  color:var(--blue-mid);
}
#baps-home .t-body{
  font-size:15.5px;
  font-weight:400;
  line-height:1.7;
  color:#333546;
}
#baps-home .t-lead{
  font-size:18px;
  font-weight:400;
  line-height:1.75;
}
#baps-home .t-small{
  display:block;
  font-family:'Montserrat',sans-serif;
  font-size:18px;
  font-weight:700;
  letter-spacing:1.1px;
  text-transform:uppercase;
  color:var(--gold-deep);
}
/* =========================================================
   SECTION SHELL
   ========================================================= */
#baps-home .section-head{
  max-width:700px;
  margin-bottom:24px;
}
#baps-home .section-head .t-small{
  margin-bottom:6px;
}
#baps-home .section-head p{
  margin-top:9px;
  color:var(--ink);
}
#baps-home .section-pad{
  padding:44px 0;
  background:transparent;
}
#baps-home .section-pad.white{
  background:var(--white);
}
#baps-home .section-pad.lav{
  background:var(--lavender);
}
#baps-home .section-pad.dark-blue{
  background:var(--blue-dark);
}
#baps-home .wave-divider{
  display:block;
  width:100%;
  line-height:0;
}
#baps-home .wave-divider svg{
  display:block;
  width:100%;
  height:52px;
}
/* =========================================================
   TABLE OF CONTENTS
   ========================================================= */
#baps-home .toc-panel{
  padding:8px 0 28px;
}
#baps-home .toc-panel > .t-small{
  margin:20px 0 14px;
  font-size:20px;
  color:var(--gold-bright);
}
#baps-home .toc-group{
  border-top:1px solid rgba(255,255,255,.18);
}
#baps-home .toc-group:last-of-type{
  border-bottom:1px solid rgba(255,255,255,.18);
}
#baps-home .toc-group summary{
  list-style:none;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:16px 4px;
}
#baps-home .toc-group summary::-webkit-details-marker{
  display:none;
}
#baps-home .toc-group summary::marker{
  content:"";
}
#baps-home .toc-group-label{
  display:flex;
  align-items:baseline;
  gap:10px;
}
#baps-home .toc-group-label .toc-year{
  font-family:'Merriweather',serif;
  font-weight:900;
  font-size:21px;
  color:var(--white);
}
#baps-home .toc-group-label .count{
  font-family:'Montserrat',sans-serif;
  font-weight:700;
  font-size:16px;
  color:var(--gold-bright);
}
#baps-home .toc-chevron{
  font-size:16px;
  color:var(--gold-bright);
  transition:transform .2s ease;
  flex-shrink:0;
}
#baps-home .toc-group[open] .toc-chevron{
  transform:rotate(180deg);
}
#baps-home .toc-clients{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  padding:2px 4px 18px;
}
#baps-home .toc-client{
  display:inline-flex;
  align-items:center;
  font-family:'Montserrat',sans-serif;
  font-weight:600;
  font-size:16.5px;
  color:var(--white);
  background:rgba(255,255,255,.08);
  border:1.5px solid rgba(255,255,255,.25);
  border-radius:999px;
  padding:8px 16px;
  cursor:pointer;
  transition:transform .15s ease, background .15s ease, color .15s ease, border-color .15s ease;
}
#baps-home .toc-client:hover{
  background:var(--gold-bright);
  color:#4a3400;
  border-color:var(--gold-bright);
  transform:translateY(-2px);
}
/* =========================================================
   SEMESTER / YEAR SECTIONS
   ========================================================= */
#baps-home .semester-block{
  margin-top:52px;
  scroll-margin-top:24px;
}
#baps-home .semester-block:first-of-type{
  margin-top:36px;
}
#baps-home .semester-title{
  display:flex;
  align-items:baseline;
  gap:14px;
  margin-bottom:28px;
  padding-bottom:16px;
  border-bottom:2px solid var(--periwinkle);
}
#baps-home .semester-title h2{
  font-size:34px;
}
#baps-home .semester-title .semester-tag{
  font-family:'Montserrat',sans-serif;
  font-weight:700;
  font-size:16px;
  letter-spacing:0.6px;
  text-transform:uppercase;
  color:var(--gold-deep);
}
/* =========================================================
   PROJECT CARDS
   ========================================================= */
#baps-home .project-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit, minmax(340px, 1fr));
  gap:26px;
}
#baps-home .project-card{
  background:var(--white);
  border:1.5px solid var(--periwinkle);
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 14px 28px -18px rgba(24,39,232,.22);
  display:flex;
  flex-direction:column;
  scroll-margin-top:24px;
}
#baps-home .project-photo{
  width:100%;
  aspect-ratio:16/9;
  background-color:var(--lavender);
  border-bottom:1.5px solid var(--periwinkle);
  background-size:cover;
  background-position:center;
}
#baps-home .project-body{
  padding:22px 24px 24px;
  display:flex;
  flex-direction:column;
  gap:8px;
}
#baps-home .project-tag{
  font-family:'Montserrat',sans-serif;
  font-weight:700;
  font-size:14px;
  letter-spacing:0.7px;
  text-transform:uppercase;
  color:var(--gold-deep);
}
#baps-home .project-body p{
  margin:0;
}
#baps-home .project-attr{
  margin-top:2px;
  font-family:'Montserrat',sans-serif;
  font-style:italic;
  font-size:13.5px;
  color:#6b6e87;
}
/* =========================================================
   FOOTER (identical to home / our team page)
   ========================================================= */
#baps-home .footer{
  background:var(--blue);
}
#baps-home .footer-bar{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  justify-content:space-between;
  gap:18px;
  padding:26px 24px;
}
#baps-home .footer-brand .footer-name{
  font-family:'Merriweather',serif;
  font-weight:900;
  font-size:clamp(20px,3vw,28px);
  color:var(--white);
}
#baps-home .footer-brand .footer-tag{
  font-family:'Montserrat',sans-serif;
  font-weight:700;
  font-size:clamp(14px,1.8vw,17px);
  color:var(--gold-bright);
  margin-top:4px;
}
#baps-home .footer-connect{
  display:flex;
  flex-direction:column;
  align-items:flex-end;
  gap:8px;
}
#baps-home .connect-label{
  font-family:'Montserrat',sans-serif;
  font-size:14px;
  color:var(--white);
}
#baps-home .connect-icons{
  display:flex;
  gap:10px;
}
#baps-home .connect-icons a{
  width:38px;
  height:38px;
  border-radius:50%;
  background:var(--white);
  color:var(--blue);
  display:flex;
  align-items:center;
  justify-content:center;
  transition:transform .15s ease, background .15s ease, color .15s ease;
}
#baps-home .connect-icons a:hover{
  background:var(--gold-bright);
  color:#4a3400;
  transform:translateY(-2px);
}
#baps-home .connect-icons svg{
  width:17px;
  height:17px;
}
@media (max-width:640px){
  #baps-home .footer-bar{
    flex-direction:column;
    align-items:flex-start;
  }
  #baps-home .footer-connect{
    align-items:flex-start;
  }
}
@media (prefers-reduced-motion:reduce){
  #baps-home *{
    animation:none !important;
    transition:none !important;
    scroll-behavior:auto !important;
  }
}

</style>
</head>

<body>
<div id="baps-home">

  <!-- =========================================================
       HEADER
       ========================================================= -->
  <header class="team-hero">
    <div class="team-hero-inner">
      <h1 id="page-title">Project Highlights</h1>
    </div>
  </header>

  <!-- =========================================================
       TABLE OF CONTENTS
       Generated from project-highlights.json
       ========================================================= -->
  <section class="section-pad dark-blue">
    <div class="wrap">
      <div class="toc-panel">
        <span class="t-small" id="toc-label">Jump to a project</span>
        <div id="toc-groups"></div>
      </div>
    </div>
  </section>

  <!-- Keep the existing single wave divider from the current page -->
  <div class="wave-divider" style="background:var(--blue-dark);">
    <svg viewBox="0 0 1440 52" preserveAspectRatio="none">
      <path
        d="M0,20 C240,60 480,0 720,20 C960,40 1200,0 1440,20 L1440,52 L0,52 Z"
        fill="var(--lavender)">
      </path>
    </svg>
  </div>

  <!-- =========================================================
       PROJECT SECTIONS
       Generated from project-highlights.json
       ========================================================= -->
  <main id="project-sections"></main>

  <!-- =========================================================
       FOOTER
       ========================================================= -->
  <footer class="footer">
    <div class="wrap footer-bar">
      <div class="footer-brand">
        <div class="footer-name">BAPS @ UVA</div>
        <div class="footer-tag">Become a Problem Solver</div>
      </div>

      <div class="footer-connect">
        <span class="connect-label">Connect with Us</span>

        <div class="connect-icons">
          <a href="mailto:bapscontact@virginia.edu" aria-label="Email">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="4" width="20" height="16" rx="2"></rect>
              <path d="M22 6 12 13 2 6"></path>
            </svg>
          </a>

          <a href="https://www.instagram.com/baps_at_uva/" target="_blank"
             rel="noopener" aria-label="Instagram">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="2" width="20" height="20" rx="5"></rect>
              <circle cx="12" cy="12" r="4"></circle>
              <circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"></circle>
            </svg>
          </a>

          <a href="https://www.linkedin.com/company/baps-at-uva/" target="_blank"
             rel="noopener" aria-label="LinkedIn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="2" width="20" height="20" rx="5"></rect>
              <line x1="7" y1="10" x2="7" y2="17"></line>
              <circle cx="7" cy="6.5" r="1" fill="currentColor" stroke="none"></circle>
              <path d="M11 17v-4.5a2.5 2.5 0 0 1 5 0V17"></path>
              <line x1="11" y1="10" x2="11" y2="17"></line>
            </svg>
          </a>
        </div>
      </div>
    </div>
  </footer>
</div>

<script>
(function () {
  /*
    IMPORTANT:
    Upload project-highlights.json to this GitHub repository path:

    https://github.com/ninghchen/bapsatuva_website_assets/blob/main/project-highlights.json

    The page reads the RAW version below.
  */
  const DATA_URL =
    'https://raw.githubusercontent.com/ninghchen/bapsatuva_website_assets/main/project-highlights.json';

  const tocGroups = document.getElementById('toc-groups');
  const projectSections = document.getElementById('project-sections');
  const pageTitle = document.getElementById('page-title');
  const tocLabel = document.getElementById('toc-label');

  function projectCountText(count) {
    return count === 1 ? '1 client' : `${count} clients`;
  }

  function createTocGroup(semester, index) {
    const details = document.createElement('details');
    details.className = 'toc-group';

    // Keep the newest semester open by default.
    if (index === 0) {
      details.open = true;
    }

    const summary = document.createElement('summary');

    const label = document.createElement('span');
    label.className = 'toc-group-label';

    const year = document.createElement('span');
    year.className = 'toc-year';
    year.textContent = semester.label;

    const count = document.createElement('span');
    count.className = 'count';
    count.textContent = `· ${projectCountText(semester.projects.length)}`;

    label.append(year, count);

    const chevron = document.createElement('span');
    chevron.className = 'toc-chevron';
    chevron.textContent = '▾';

    summary.append(label, chevron);
    details.appendChild(summary);

    const clients = document.createElement('div');
    clients.className = 'toc-clients';

    semester.projects.forEach(project => {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'toc-client';
      button.dataset.target = project.id;
      button.textContent = project.client;

      button.addEventListener('click', function () {
        const target = document.getElementById(project.id);
        if (target) {
          target.scrollIntoView({
            behavior: 'smooth',
            block: 'start'
          });
        }
      });

      clients.appendChild(button);
    });

    details.appendChild(clients);
    return details;
  }

  function createProjectCard(project) {
    const card = document.createElement('div');
    card.className = 'project-card';
    card.id = project.id;

    const photo = document.createElement('div');
    photo.className = 'project-photo';

    if (project.image) {
      photo.style.backgroundImage = `url("${project.image}")`;
    }

    const body = document.createElement('div');
    body.className = 'project-body';

    const tag = document.createElement('span');
    tag.className = 'project-tag';
    tag.textContent = project.tag;

    const title = document.createElement('h3');
    title.className = 't-h3';
    title.textContent = project.client;

    const description = document.createElement('p');
    description.className = 't-body';
    description.textContent = project.description;

    body.append(tag, title, description);

    if (project.attribution) {
      const attribution = document.createElement('span');
      attribution.className = 'project-attr';
      attribution.textContent = project.attribution;
      body.appendChild(attribution);
    }

    card.append(photo, body);
    return card;
  }

  function createSemesterSection(semester) {
    const section = document.createElement('section');
    section.className = `section-pad ${semester.sectionClass || 'lav'}`;

    const wrap = document.createElement('div');
    wrap.className = 'wrap';

    const block = document.createElement('div');
    block.className = 'semester-block';
    block.id = semester.id;

    const titleRow = document.createElement('div');
    titleRow.className = 'semester-title';

    const heading = document.createElement('h2');
    heading.textContent = semester.label;

    const tag = document.createElement('span');
    tag.className = 'semester-tag';
    tag.textContent = projectCountText(semester.projects.length);

    titleRow.append(heading, tag);

    const grid = document.createElement('div');
    grid.className = 'project-grid';

    semester.projects.forEach(project => {
      grid.appendChild(createProjectCard(project));
    });

    block.append(titleRow, grid);
    wrap.appendChild(block);
    section.appendChild(wrap);

    return section;
  }

  fetch(DATA_URL, { cache: 'no-store' })
    .then(response => {
      if (!response.ok) {
        throw new Error(`HTTP ${response.status} while loading project data.`);
      }
      return response.json();
    })
    .then(data => {
      if (data.page) {
        if (data.page.title) {
          pageTitle.textContent = data.page.title;
          document.title = `${data.page.title} — BAPS @ UVA`;
        }

        if (data.page.tocLabel) {
          tocLabel.textContent = data.page.tocLabel;
        }
      }

      tocGroups.innerHTML = '';
      projectSections.innerHTML = '';

      data.semesters.forEach((semester, index) => {
        tocGroups.appendChild(createTocGroup(semester, index));
        projectSections.appendChild(createSemesterSection(semester));
      });
    })
    .catch(error => {
      console.error('Unable to load project highlights:', error);

      projectSections.innerHTML = `
        <section class="section-pad lav">
          <div class="wrap">
            <p class="t-body">
              Project information could not be loaded. Please check the JSON file URL.
            </p>
          </div>
        </section>
      `;
    });
})();
</script>

</body>
</html>
